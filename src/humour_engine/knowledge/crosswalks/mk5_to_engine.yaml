# MaryKenneth five-class humour styles (Humour_style.xlsx) to engine social_function.
# Source labels are kept intact under namespace mk5; this file only states relations.
id: mk5_to_engine
version: 1
source_namespace: mk5
target_namespace: engine.social_function
mapping_author: humour-engine build 2026-11-17 (provisional, pending human review)
label_ids:
  0: self-enhancing
  1: self-deprecating
  2: affiliative
  3: aggressive
  4: neutral
relations:
  - {source: self-enhancing, target: self_enhancing, relation: equivalent}
  - {source: self-deprecating, target: self_directed, relation: overlapping,
     note: "self-deprecating is a style label; it is not the psychological construct self-defeating and is not mapped to it"}
  - {source: affiliative, target: affiliative, relation: equivalent}
  - {source: aggressive, target: aggressive, relation: equivalent}
  - {source: neutral, target: null, relation: unmapped,
     note: "mk5 neutral means a non-humorous control text; it maps to comic_reading=not_supported, not to a social function"}
gate:  # four-class gate space used by Humour_style_4classes.xlsx and the hierarchical model
  label_ids: {0: self-enhancing, 1: self-deprecating, 2: affiliative_or_aggressive, 3: neutral}
  final_to_gate: {0: 0, 1: 1, 2: 2, 3: 2, 4: 3}
  binary_specialist: {0: 2, 1: 3}  # af_ag binary 0 -> final affiliative(2), 1 -> final aggressive(3)
